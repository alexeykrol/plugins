verdict: seed
text: >-
  Сегодня разберём, почему демонстрации агентов ломаются на живых клиентах. Начну с наблюдения:
  демо собирают на удачных примерах, а в жизни каждый десятый случай странный. Дальше — три правила:
  суждение отдаём модели, а учёт коду; маленькие задачи надёжнее больших; контракт делает ошибку
  невозможной. И в конце — как это проверять замером, а не ощущениями.
lesson: "Цельный блок: постановка проблемы, раскрытие по шагам и итог — смотрится как отдельный урок."
